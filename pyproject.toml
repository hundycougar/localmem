[project]
name = "localmem"
version = "0.1.0"
description = "Local client for mem.ai"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "flask>=3.0",
    "rich>=13.0",
]

[project.scripts]
localmem = "localmem.cli:cli"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.backends._legacy:_Backend"
