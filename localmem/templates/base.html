<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}localmem{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 48rem; margin: 2rem auto; padding: 0 1rem;
      color: #1a1a1a; background: #fafafa;
      line-height: 1.6;
    }
    nav { display: flex; gap: 1rem; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid #ddd; padding-bottom: 1rem; }
    nav a { text-decoration: none; color: #555; font-weight: 500; }
    nav a:hover { color: #000; }
    nav .brand { font-weight: 700; color: #000; margin-right: auto; }
    .search-form { display: flex; gap: 0.5rem; }
    .search-form input[type="text"] { padding: 0.4rem 0.6rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
    .search-form button { padding: 0.4rem 0.8rem; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    a { color: #2563eb; }
    textarea { width: 100%; min-height: 14rem; padding: 0.8rem; font-family: ui-monospace, monospace; font-size: 0.9rem; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
    .btn { display: inline-block; padding: 0.5rem 1rem; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; text-decoration: none; }
    .btn:hover { background: #1d4ed8; }
    .note-list { list-style: none; padding: 0; }
    .note-list li { padding: 0.6rem 0; border-bottom: 1px solid #eee; }
    .note-list li a { text-decoration: none; }
    .note-meta { font-size: 0.8rem; color: #888; }
    .note-content { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.9rem; background: #fff; padding: 1rem; border: 1px solid #eee; border-radius: 4px; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="brand">localmem</a>
    <a href="/new">+ New</a>
    <form action="/search" method="get" class="search-form">
      <input type="text" name="q" placeholder="Search notes…" value="{{ request.args.get('q', '') }}">
      <button type="submit">Search</button>
    </form>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
