{% extends "base.html" %}
{% block title %}New Note — localmem{% endblock %}
{% block content %}
<h2>New Note</h2>
<form method="post">
  <p>First line becomes the title. Markdown supported.</p>
  <textarea name="content" autofocus placeholder="# My note&#10;&#10;Write something…"></textarea>
  <br><br>
  <button type="submit" class="btn">Create Note</button>
</form>
{% endblock %}
